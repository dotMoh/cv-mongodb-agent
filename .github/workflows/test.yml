# Runs the fast test suite (mock mode, no Atlas/Ollama/secrets) on every push and PR
# to main. With branch protection on, a red run blocks the merge.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Governed-memory tests
        run: python -m pytest -v -rs
      - name: Demo smoke run (agent.demo, mock mode)
        env: {DATA_SOURCE: mock, LLM_MODE: fallback, EMBEDDINGS: hash}
        run: |
          if [ -f data/samples/u4_outage_24h.csv ]; then python -m agent.demo
          else echo "Skipping demo: data/samples/ is not on this branch yet"; fi
